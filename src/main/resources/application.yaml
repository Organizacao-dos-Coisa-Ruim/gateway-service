server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          # CORS liberado para o front-end e ferramentas de teste
          globalcors:
            cors-configurations:
              "[/**]":
                allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
                allowed-methods: "*"
                allowed-headers: "*"
          # Rotas por prefixo. Cada URL pode ser sobrescrita por variável de ambiente.
          routes:
            - id: auth
              uri: ${AUTH_URL:http://auth:8080}
              predicates:
                - Path=/auth/**
            - id: account
              uri: ${ACCOUNT_URL:http://account:8080}
              predicates:
                - Path=/accounts/**
            - id: product
              uri: ${PRODUCT_URL:http://product:8080}
              predicates:
                - Path=/products/**
            - id: order
              uri: ${ORDER_URL:http://order:8080}
              predicates:
                - Path=/orders/**
            - id: exchange
              uri: ${EXCHANGE_URL:http://exchange:8080}
              predicates:
                - Path=/exchange/**

# URL do serviço de autenticação usada pelo AuthorizationFilter para validar o token
pma:
  auth:
    url: ${AUTH_URL:http://auth:8080}

management:
  endpoints:
    web:
      base-path: /gateway/actuator
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
